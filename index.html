<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ハンズフリー撮影＆音声ログ（試作版 v3）</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --accent-green: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #020617;
      border-bottom: 1px solid #334155;
      gap: 6px;
      flex-shrink: 0;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: bold;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
    }
    .dot.active {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    select, button {
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: var(--panel);
      color: var(--text);
      padding: 6px 10px;
    }
    button:active { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #020617; font-weight: bold; border: none; }
    .btn-green { background: var(--accent-green); color: #020617; font-weight: bold; border: none; }
    .btn-danger { background: var(--danger); color: #fff; font-weight: bold; border: none; }

    .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .view.active { display: flex; }

    .camera-box {
      position: relative;
      height: 50%;
      background: #000;
      overflow: hidden;
      flex-shrink: 0;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-overlay {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      pointer-events: none;
      flex-wrap: wrap;
    }
    .pill {
      background: rgba(2, 6, 23, 0.78);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease-out;
    }
    .flash.show { opacity: 0.85; }

    .log-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    .trigger-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: var(--panel);
      font-size: 11px;
      color: var(--muted);
      border-bottom: 1px solid #334155;
      gap: 6px;
    }
    .trigger-bar input {
      background: #0f172a;
      border: 1px solid #475569;
      color: var(--text);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      width: 165px;
    }
    .stream-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-item {
      font-size: 14px;
      line-height: 1.45;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.7);
      word-break: break-word;
    }
    .log-item.photo-marker {
      background: rgba(56, 189, 248, 0.18);
      border-left: 4px solid var(--accent);
      color: var(--accent);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .log-item.interim {
      color: var(--muted);
      font-style: italic;
      border: 1px dashed #475569;
      background: transparent;
    }
    .time {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    footer {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      background: #020617;
      border-top: 1px solid #334155;
      flex-shrink: 0;
    }
    footer button {
      flex: 1;
      padding: 12px 8px;
      font-size: 14px;
    }

    .review-toolbar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: var(--panel);
      border-bottom: 1px solid #334155;
      flex-wrap: wrap;
    }
    .review-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--accent);
      font-weight: bold;
    }
    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .card img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #000;
      border-radius: 8px;
    }
    .card textarea {
      width: 100%;
      min-height: 68px;
      background: #0f172a;
      color: var(--text);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 8px;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
    }
    .empty-msg {
      text-align: center;
      color: var(--muted);
      margin-top: 40px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="status-badge">
      <span id="recDot" class="dot"></span>
      <span id="statusText">待機中</span>
    </div>
    <select id="moodPreset" title="現場モード切替">
      <option value="quick">⚡ テンポ重視</option>
      <option value="standard" selected>🌿 標準モード</option>
      <option value="strict">🛡️ 誤爆防止</option>
    </select>
    <button id="toggleViewBtn" class="btn-primary">確認・作成へ</button>
  </header>

  <main id="captureView" class="view active">
    <div class="camera-box">
      <video id="video" autoplay playsinline muted></video>
      <div class="camera-overlay">
        <span class="pill" id="photoCountPill">📷 0枚</span>
        <span class="pill" id="cooldownPill">🟢 撮影待機</span>
        <span class="pill" id="speechStatePill">🎤 マイク停止中</span>
      </div>
      <div id="flash" class="flash"></div>
    </div>

    <div class="log-box">
      <div class="trigger-bar">
        <span>撮影ワード(カンマ区切り):</span>
        <input id="triggerWords" type="text" value="シャッター,写真撮影,次へ" />
      </div>
      <div id="streamList" class="stream-list">
        <div class="log-item">v3適用済み：1回撮影すると8秒間は連続撮影をロックします。</div>
      </div>
    </div>

    <footer>
      <button id="startStopBtn" class="btn-green">▶ 収録スタート</button>
      <button id="manualSnapBtn">📷 手動撮影</button>
    </footer>
  </main>

  <main id="reviewView" class="view">
    <div class="review-toolbar">
      <button id="copyMdBtn" class="btn-primary">📋 テキストコピー</button>
      <button id="downloadHtmlBtn" class="btn-green">🌐 HTML保存</button>
      <button id="clearAllBtn" class="btn-danger">🗑️ 全消去</button>
    </div>
    <div id="reviewList" class="review-list"></div>
  </main>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let isRecording = false;
    let recognition = null;
    let stream = null;
    let entries = [];
    let photoCount = 0;
    let lastTriggerAt = 0;
    let isCapturingLock = false;
    let interimEl = null;

    const COOLDOWN_MS = 8000; // 8秒間は2枚目以降を完全ブロック

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const flash = document.getElementById('flash');
    const streamList = document.getElementById('streamList');
    const startStopBtn = document.getElementById('startStopBtn');
    const manualSnapBtn = document.getElementById('manualSnapBtn');
    const toggleViewBtn = document.getElementById('toggleViewBtn');
    const captureView = document.getElementById('captureView');
    const reviewView = document.getElementById('reviewView');
    const reviewList = document.getElementById('reviewList');
    const recDot = document.getElementById('recDot');
    const statusText = document.getElementById('statusText');
    const photoCountPill = document.getElementById('photoCountPill');
    const cooldownPill = document.getElementById('cooldownPill');
    const speechStatePill = document.getElementById('speechStatePill');
    const triggerWordsInput = document.getElementById('triggerWords');
    const moodPreset = document.getElementById('moodPreset');

    setInterval(() => {
      const remain = Math.ceil((lastTriggerAt + COOLDOWN_MS - Date.now()) / 1000);
      if (remain > 0) {
        cooldownPill.textContent = `🔒 ${remain}秒待機`;
      } else {
        cooldownPill.textContent = `🟢 撮影待機`;
      }
    }, 500);

    moodPreset.addEventListener('change', () => {
      const v = moodPreset.value;
      if (v === 'quick') {
        triggerWordsInput.value = '撮る,次,写真';
      } else if (v === 'standard') {
        triggerWordsInput.value = 'シャッター,写真撮影,次へ';
      } else if (v === 'strict') {
        triggerWordsInput.value = 'シャッターチャンス,写真撮影,次の工程';
      }
    });

    function nowStr() {
      return new Date().toLocaleTimeString('ja-JP', { hour12: false });
    }

    async function initCamera() {
      if (stream) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 960 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (e) {
        alert('カメラの起動に失敗しました。HTTPS環境かアクセス許可を確認してください。\n' + e.message);
      }
    }

    function takePhoto(reason = '音声') {
      const now = Date.now();
      if (isCapturingLock) return;
      if (now - lastTriggerAt < COOLDOWN_MS) return;
      if (!video.videoWidth) return;

      // 最初にロックとタイムスタンプを確定して二重呼び出しを防ぐ
      isCapturingLock = true;
      lastTriggerAt = now;
      setTimeout(() => { isCapturingLock = false; }, 1000);

      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 150);

      const maxW = 800;
      const scale = Math.min(1, maxW / video.videoWidth);
      canvas.width = Math.round(video.videoWidth * scale);
      canvas.height = Math.round(video.videoHeight * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.78);

      photoCount++;
      const t = nowStr();
      const entry = { id: now, type: 'photo', num: photoCount, time: t, image: dataUrl };
      entries.push(entry);
      saveLocal();

      photoCountPill.textContent = `📷 ${photoCount}枚`;
      cooldownPill.textContent = `🔒 8秒待機`;

      const div = document.createElement('div');
      div.className = 'log-item photo-marker';
      div.innerHTML = `<span>📷 写真 #${photoCount}（${reason}）</span><span class="time">${t}</span>`;
      insertLogElement(div);
    }

    function insertLogElement(el) {
      if (interimEl && interimEl.parentNode === streamList) {
        streamList.insertBefore(el, interimEl);
      } else {
        streamList.appendChild(el);
      }
      streamList.scrollTop = streamList.scrollHeight;
    }

    function appendTextLog(text) {
      const clean = text.trim();
      if (!clean) return;
      const t = nowStr();
      entries.push({ id: Date.now() + Math.random(), type: 'text', time: t, text: clean });
      saveLocal();

      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = `<span class="time">${t}</span>${escapeHtml(clean)}`;
      insertLogElement(div);
    }

    function setupSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('このブラウザは音声認識（Web Speech API）に対応していません。iPhoneのSafariでお試しください。');
        return null;
      }
      const rec = new SpeechRecognition();
      rec.lang = 'ja-JP';
      rec.continuous = true;
      rec.interimResults = true;

      rec.onstart = () => {
        speechStatePill.textContent = '🎤 音声認識中';
      };

      rec.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const res = event.results[i];
          const transcript = res[0].transcript;

          if (res.isFinal) {
            if (interimEl) {
              interimEl.remove();
              interimEl = null;
            }
            handleFinalPhrase(transcript);
          } else {
            interimTranscript += transcript;
          }
        }

        if (interimTranscript) {
          if (!interimEl) {
            interimEl = document.createElement('div');
            interimEl.className = 'log-item interim';
            streamList.appendChild(interimEl);
          }
          interimEl.textContent = '… ' + interimTranscript;
          streamList.scrollTop = streamList.scrollHeight;
        }
      };

      rec.onerror = (e) => {
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          speechStatePill.textContent = '⚠️ 音声エラー: ' + e.error;
        }
      };

      rec.onend = () => {
        if (isRecording) {
          try {
            rec.start();
          } catch (_) {}
        } else {
          speechStatePill.textContent = '🎤 マイク停止中';
        }
      };

      return rec;
    }

    function getTriggerList() {
      return triggerWordsInput.value
        .split(/[,、]/)
        .map(w => w.trim())
        .filter(Boolean);
    }

    function handleFinalPhrase(text) {
      const triggers = getTriggerList();
      let matchedWord = null;

      for (const word of triggers) {
        if (text.includes(word)) {
          matchedWord = word;
          break;
        }
      }

      if (matchedWord) {
        takePhoto(`「${matchedWord}」`);
      }

      const cleanedText = text.trim();
      if (cleanedText) {
        appendTextLog(cleanedText);
      }
    }

    startStopBtn.addEventListener('click', async () => {
      if (!isRecording) {
        await initCamera();
        if (!recognition) recognition = setupSpeech();
        isRecording = true;
        try { recognition && recognition.start(); } catch (_) {}

        recDot.classList.add('active');
        statusText.textContent = '収録中';
        startStopBtn.textContent = '⏹ 一時停止';
        startStopBtn.className = 'btn-danger';
      } else {
        isRecording = false;
        try { recognition && recognition.stop(); } catch (_) {}

        recDot.classList.remove('active');
        statusText.textContent = '一時停止';
        startStopBtn.textContent = '▶ 収録再開';
        startStopBtn.className = 'btn-green';
      }
    });

    manualSnapBtn.addEventListener('click', async () => {
      await initCamera();
      takePhoto('手動');
    });

    toggleViewBtn.addEventListener('click', () => {
      const isCapture = captureView.classList.contains('active');
      if (isCapture) {
        captureView.classList.remove('active');
        reviewView.classList.add('active');
        toggleViewBtn.textContent = '← カメラに戻る';
        renderReview();
      } else {
        reviewView.classList.remove('active');
        captureView.classList.add('active');
        toggleViewBtn.textContent = '確認・作成へ';
      }
    });

    function buildManualBlocks() {
      const blocks = [];
      let currentBlock = { title: '導入メモ（撮影前）', time: '', image: null, texts: [] };

      for (const item of entries) {
        if (item.type === 'photo') {
          if (currentBlock.image || currentBlock.texts.length > 0) {
            blocks.push(currentBlock);
          }
          currentBlock = {
            title: `ステップ ${item.num}`,
            time: item.time,
            image: item.image,
            texts: []
          };
        } else if (item.type === 'text') {
          currentBlock.texts.push(item.text);
        }
      }
      if (currentBlock.image || currentBlock.texts.length > 0) {
        blocks.push(currentBlock);
      }
      return blocks;
    }

    function renderReview() {
      const blocks = buildManualBlocks();
      reviewList.innerHTML = '';

      if (blocks.length === 0) {
        reviewList.innerHTML = '<div class="empty-msg">まだ記録データがありません。カメラ画面で撮影・音声入力を行ってください。</div>';
        return;
      }

      blocks.forEach((b, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        const imgHtml = b.image
          ? `<img src="${b.image}" alt="${escapeHtml(b.title)}" />
             <div class="card-actions">
               <button type="button" onclick="downloadSinglePhoto(${idx})">📥 この写真を保存</button>
             </div>`
          : '';
        card.innerHTML = `
          <div class="card-header">
            <span>${escapeHtml(b.title)} ${b.time ? `(${b.time})` : ''}</span>
            <span>#${idx + 1}</span>
          </div>
          ${imgHtml}
          <textarea data-block="${idx}" placeholder="音声コメントがここに入ります（手修正も可能）">${escapeHtml(b.texts.join('\n'))}</textarea>
        `;
        reviewList.appendChild(card);
      });
    }

    window.downloadSinglePhoto = function(blockIndex) {
      const blocks = buildManualBlocks();
      const b = blocks[blockIndex];
      if (!b || !b.image) return;
      const a = document.createElement('a');
      a.href = b.image;
      a.download = `step-${blockIndex + 1}-${Date.now()}.jpg`;
      a.click();
    };

    function buildHtmlDocument() {
      const blocks = buildManualBlocks();
      const textareas = reviewList.querySelectorAll('textarea');
      const dateStr = new Date().toLocaleDateString('ja-JP');

      let bodyHtml = `<h1>作業記録・マニュアル (${escapeHtml(dateStr)})</h1>`;
      blocks.forEach((b, idx) => {
        const comment = (textareas[idx] ? textareas[idx].value.trim() : b.texts.join('\n')) || '（コメントなし）';
        bodyHtml += `<h2>${escapeHtml(b.title)} ${b.time ? `[${escapeHtml(b.time)}]` : ''}</h2>`;
        if (b.image) {
          bodyHtml += `<p><img src="${b.image}" style="max-width:480px;width:100%;height:auto;" /></p>`;
        }
        bodyHtml += `<p>${escapeHtml(comment).replace(/\n/g, '<br>')}</p><hr/>`;
      });
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${bodyHtml}</body></html>`;
    }

    document.getElementById('downloadHtmlBtn').addEventListener('click', () => {
      const html = buildHtmlDocument();
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `manual-${Date.now()}.html`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('copyMdBtn').addEventListener('click', async () => {
      const blocks = buildManualBlocks();
      const textareas = reviewList.querySelectorAll('textarea');
      let md = `# 作業記録・マニュアル (${new Date().toLocaleDateString('ja-JP')})\n\n`;

      blocks.forEach((b, idx) => {
        const editedText = textareas[idx] ? textareas[idx].value.trim() : b.texts.join('\n');
        md += `## ${b.title} ${b.time ? `[${b.time}]` : ''}\n`;
        if (b.image) md += `[写真あり]\n`;
        md += `${editedText || '（コメントなし）'}\n\n`;
      });

      await navigator.clipboard.writeText(md);
      alert('テキストをクリップボードにコピーしました！');
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (!confirm('記録した写真と音声ログをすべて消去しますか？')) return;
      entries = [];
      photoCount = 0;
      localStorage.removeItem('voice_cam_proto_v1');
      photoCountPill.textContent = '📷 0枚';
      streamList.innerHTML = '<div class="log-item">ログをリセットしました。</div>';
      renderReview();
    });

    function saveLocal() {
      try {
        localStorage.setItem('voice_cam_proto_v1', JSON.stringify({ entries, photoCount }));
      } catch (e) {
        console.warn('容量上限のため一部保存スキップ:', e);
      }
    }

    function loadLocal() {
      try {
        const raw = localStorage.getItem('voice_cam_proto_v1');
        if (!raw) return;
        const parsed = JSON.parse(raw);
        entries = parsed.entries || [];
        photoCount = parsed.photoCount || 0;
        photoCountPill.textContent = `📷 ${photoCount}枚`;

        if (entries.length > 0) {
          streamList.innerHTML = '';
          entries.forEach(item => {
            const div = document.createElement('div');
            if (item.type === 'photo') {
              div.className = 'log-item photo-marker';
              div.innerHTML = `<span>📷 写真 #${item.num}</span><span class="time">${item.time}</span>`;
            } else {
              div.className = 'log-item';
              div.innerHTML = `<span class="time">${item.time}</span>${escapeHtml(item.text)}`;
            }
            streamList.appendChild(div);
          });
        }
      } catch (_) {}
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    loadLocal();
  </script>
</body>
</html>
